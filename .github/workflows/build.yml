name: Build and Release Tux Combat

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows and Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Godot 4.4.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Verify Godot
        run: godot --version

      - name: Import project
        run: godot --headless --editor --path . --quit

      - name: Export Windows
        run: |
          mkdir -p build/windows
          godot --headless --path . --export-release "Windows Desktop" build/windows/TuxCombat.exe

      - name: Export Linux
        run: |
          mkdir -p build/linux
          godot --headless --path . --export-release "Linux/X11" build/linux/TuxCombat.x86_64
          chmod +x build/linux/TuxCombat.x86_64

      - name: Package builds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cd build
          zip -qr ../dist/TuxCombat-Windows.zip windows
          tar -czf ../dist/TuxCombat-Linux.tar.gz linux
          cd ..
          sha256sum dist/TuxCombat-Windows.zip dist/TuxCombat-Linux.tar.gz > dist/SHA256SUMS.txt
          ls -lh dist

      - name: Create Windows release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "windows-${{ github.run_number }}" \
            dist/TuxCombat-Windows.zip \
            --title "Tux Combat Windows Build ${{ github.run_number }}" \
            --notes "Automated Windows build from commit ${{ github.sha }}."

      - name: Create Linux release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "linux-${{ github.run_number }}" \
            dist/TuxCombat-Linux.tar.gz \
            --title "Tux Combat Linux Build ${{ github.run_number }}" \
            --notes "Automated Linux build from commit ${{ github.sha }}."

      - name: Create checksums release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "checksums-${{ github.run_number }}" \
            dist/SHA256SUMS.txt \
            --title "Tux Combat Checksums ${{ github.run_number }}" \
            --notes "SHA-256 checksums for the Windows and Linux builds from commit ${{ github.sha }}."
