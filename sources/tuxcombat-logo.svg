<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc">
  <title id="title">Tux Combat</title>
  <desc id="desc">Tux Combat logo featuring a classic Linux-style black penguin with a white belly, bright yellow beak and feet, and a bold arcade-fighting wordmark.</desc>
  <defs>
